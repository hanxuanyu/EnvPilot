name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_OPTIONS: --max-old-space-size=4096

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-core-tests:
    name: Verify Core Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run core Go tests
        run: make test-core

  build-server-linux:
    name: Build Linux Server ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: verify-core-tests
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Download Go dependencies
        run: go mod download

      - name: Build linux server artifact
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: make build-server-target

      - name: Package linux server artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release
          binary="envpilot-server-linux-${GOARCH}"
          archive="release/${binary}-${TAG_NAME}.tar.gz"
          tar -czf "$archive" -C bin "$binary"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload linux server artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-server-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  build-desktop-macos:
    name: Build macOS Desktop Universal
    runs-on: macos-latest
    needs: verify-core-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build universal desktop application
        run: make build-desktop DESKTOP_PLATFORM=darwin/universal

      - name: Package macOS desktop artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app_path="build/bin/EnvPilot.app"
          if [[ ! -d "$app_path" ]]; then
            echo "missing desktop bundle: $app_path" >&2
            exit 1
          fi
          mkdir -p release
          archive="release/EnvPilot-${TAG_NAME}-darwin-universal.tar.gz"
          tar -czf "$archive" -C build/bin EnvPilot.app
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload macOS desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-desktop
          path: release/*
          if-no-files-found: error

  build-desktop-windows:
    name: Build Windows Desktop ${{ matrix.arch }}
    runs-on: windows-latest
    needs: verify-core-tests
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Add Go bin to PATH
        shell: pwsh
        run: |
          $gobin = Join-Path (go env GOPATH) 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $gobin

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Download Go dependencies
        run: go mod download

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build Windows desktop application
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          npm run build --prefix frontend
          go run ./cmd/buildmeta -mode sync
          wails build -ldflags "-s -w" -o EnvPilot-${{ matrix.arch }}.exe -platform windows/${{ matrix.arch }}

          $expectedExe = "build/bin/EnvPilot-$env:ARCH.exe"
          $legacyOutput = "build/bin/EnvPilot-$env:ARCH"
          if ((-not (Test-Path $expectedExe)) -and (Test-Path $legacyOutput)) {
            Rename-Item -Path $legacyOutput -NewName (Split-Path -Leaf $expectedExe)
          }
          if (-not (Test-Path $expectedExe)) {
            throw "missing expected windows executable: $expectedExe"
          }

      - name: Package Windows desktop artifact
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          $exePath = "build/bin/EnvPilot-$env:ARCH.exe"
          if (-not (Test-Path $exePath)) {
            throw "missing expected desktop executable: $exePath"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $archive = "release/EnvPilot-$env:TAG_NAME-windows-$env:ARCH.zip"
          Compress-Archive -Path $exePath -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  $(Split-Path -Leaf $archive)"

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-desktop-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-server-linux
      - build-desktop-macos
      - build-desktop-windows

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*