# EnvPilot 系统配置文件（通过配置管理页面更新）
app:
    name: EnvPilot
    data_dir: ./data
    log_dir: ./logs
log:
    level: info
    filename: envpilot.log
    max_size: 100
    max_backups: 7
    max_age: 30
    compress: true
database:
    filename: envpilot.db
    max_idle_conns: 2
    max_open_conns: 10
security:
    master_password_enabled: true
    salt_file: .salt
    dangerous_commands:
        - rm -rf
        - DROP
        - DELETE
        - TRUNCATE
        - FORMAT
dns:
    enabled: false
    listen_addr: 127.0.0.1:53
    upstream: 8.8.8.8:53
    default_ttl: 300
health:
    check_interval: 60
    timeout: 10
    auto_check: false
