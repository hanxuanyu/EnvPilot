# EnvPilot 系统配置文件（通过配置管理页面更新）
app:
    name: EnvPilot
    data_dir: ./data
    log_dir: ./logs
log:
    level: info
    filename: envpilot.log
    max_size: 100
    max_backups: 7
    max_age: 30
    compress: true
database:
    driver: mysql
    host: 192.168.31.40
    port: 3306
    username: envpilot_test
    password: "S4RNEFxWD2YwaieA"
    dbname: envpilot_test
    params: "charset=utf8mb4&parseTime=True&loc=UTC"
    filename: envpilot.db
    max_idle_conns: 5
    max_open_conns: 20
security:
    master_password_enabled: false
    salt_file: .salt
    dangerous_commands:
        - rm -rf
        - DROP
        - DELETE
        - TRUNCATE
        - FORMAT
dns:
    enabled: false
    listen_addr: 127.0.0.1:53
    upstream: 8.8.8.8:53
    default_ttl: 300
health:
    check_interval: 60
    timeout: 10
    auto_check: false
audit:
    auto_cleanup: true
    retention_days: 90
    max_records: 50000
    cleanup_interval_hours: 24
